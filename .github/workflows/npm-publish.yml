name: Publish npm package

# Publishes the npm wrapper (npm/) for an already published GitHub Release.
#
# Two entry points:
#   * workflow_call    – release.yml calls this right after it creates the
#                        release, so pushing a `v*` tag ends up on npm.
#   * workflow_dispatch – re-publish or repair a version by hand.
#
# Deliberately NOT `on: release: published`: the release is created by
# release.yml with the built-in GITHUB_TOKEN, and GitHub never starts a new
# workflow run from events caused by that token, so such a workflow would
# silently never fire. Calling the logic as a reusable workflow from
# release.yml is the reliable equivalent.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to publish (e.g. v0.1.0)
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to publish (e.g. v0.1.0)
        required: true
        type: string
      dry_run:
        description: Run the whole pipeline but skip the final npm publish
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  npm:
    name: Publish maactl to npm
    # Linux on purpose: the wrapper itself is platform independent, and packing
    # the platform packages here records the executable bit in their tarballs.
    # (The wrapper still fixes the mode after an install, because a tarball
    # packed on Windows carries no Unix mode at all.)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm publish --provenance needs an OIDC token
    # Job-level env so the steps below can skip publishing when the secret is
    # missing (forks, local dispatch) instead of failing.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # release.py lists local tags

      - name: Compute version metadata from the tag
        id: meta
        run: python3 .github/scripts/release.py metadata --tag "$TAG" >> "$GITHUB_OUTPUT"

      - name: Check the tag carries the npm package
        run: |
          # Tags cut before npm/ existed cannot be published; fail with a clear
          # message instead of a cryptic error from the steps below.
          if [ ! -f npm/package.json ]; then
            echo "::error::tag $TAG predates the npm/ package; there is nothing to publish to npm"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download every platform archive of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # One archive per platform, each holding the self-contained and the
          # lite executable; the platform packages are built from these.
          gh release download "$TAG" --pattern "maactl-*-*.zip" --dir dist --clobber
          ls -l dist

      - name: Stamp the package version from the tag
        working-directory: npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # `npm version` runs the sync-version hook; run it once more so a
          # version that did not change still re-pins the platform packages.
          node scripts/platform-packages.js sync-version
          node scripts/platform-packages.js check
          echo "publishing maactl@$VERSION"

      - name: Run wrapper tests
        working-directory: npm
        run: npm test

      - name: Build the platform packages
        working-directory: npm
        run: node scripts/platform-packages.js prepare --dist ../dist

      - name: Check the npm registry for an existing version
        id: exists
        working-directory: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "maactl@$version" version >/dev/null 2>&1; then
            already=true
          else
            already=false
          fi
          echo "maactl@${version} already on npm: $already"
          echo "already=$already" >> "$GITHUB_OUTPUT"

      - name: Publish the platform packages
        if: success() && env.NODE_AUTH_TOKEN != '' && env.DRY_RUN != 'true' && steps.exists.outputs.already == 'false'
        working-directory: npm
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          tag=$([ "$CHANNEL" = "stable" ] && echo latest || echo "$CHANNEL")
          echo "npm dist-tag: $tag"
          npm run platforms:publish -- --tag "$tag"

      - name: Publish the wrapper
        if: success() && env.NODE_AUTH_TOKEN != '' && env.DRY_RUN != 'true' && steps.exists.outputs.already == 'false'
        working-directory: npm
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          # Last on purpose: the wrapper's optional dependencies must already
          # exist, or the first installs would silently skip them.
          tag=$([ "$CHANNEL" = "stable" ] && echo latest || echo "$CHANNEL")
          npm publish --access public --provenance --tag "$tag"

      - name: Report why nothing was published
        if: success() && (env.NODE_AUTH_TOKEN == '' || env.DRY_RUN == 'true' || steps.exists.outputs.already == 'true')
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not configured; add the repository secret to enable npm publishing."
          elif [ "$DRY_RUN" = 'true' ]; then
            echo 'dry run: skipped the final npm publish'
          else
            echo 'This version is already on npm; nothing to publish (versions cannot be overwritten).'
          fi
